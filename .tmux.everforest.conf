# COLORSCHEME: everforest dark medium
set -g @bg_dim '#232a2e'
set -g @bg0 '#2d353b'
set -g @bg1 '#343f44'
set -g @bg2 '#3d484d'
set -g @bg3 '#475258'
set -g @bg4 '#4f585e'
set -g @bg5 '#56635f'
set -g @bg_visual '#543a48'
set -g @bg_red '#514045'
set -g @bg_green '#425047'
set -g @bg_blue '#3a515d'
set -g @bg_yellow '#4d4c43'

set -g @fg '#d3c6aa'
set -g @red '#e67e80'
set -g @orange '#e69875'
set -g @yellow '#dbbc7f'
set -g @green '#a7c080'
set -g @aqua '#83c092'
set -g @blue '#7fbbb3'
set -g @purple '#d699b6'
set -g @grey0 '#7a8478'
set -g @grey1 '#859289'
set -g @grey2 '#9da9a0'
set -g @statusline1 '#a7c080'
set -g @statusline2 '#d3c6aa'
set -g @statusline3 '#e67e80'

# ---- General ----
set -g status-interval 2

# Session switcher (Prefix + S), fuzzy finder (Prefix + TAB)
set-option -g mode-style fg='#{@orange}',bg='#{@bg_dim}'

# Statusbar colors
set-option -g status-style fg='#{@fg}',bg='#{@bg_dim}'

# Remove underline from active window tab
set-window-option -g window-status-current-style bg='#{@bg_dim}'

# Remove the thick padding around view previews
set -g tree-mode-border-style fg='#{@blue}',bg=default

# ---- Panes ----
# pane borders
set-option -g pane-border-style fg='#{@bg3}'
set-option -g pane-active-border-style 'fg=#{@blue}'

# pane number display
set-option -gF display-panes-active-colour '#{@blue}'
set-option -gF display-panes-colour '#{@orange}'

# ---- Command bar ----
# message info
set-option -gF message-style 'fg=#{@aqua},bg=#{@bg_blue},fill=#{@bg_blue}'

# writing commands inactive
set-option -gF message-command-style 'fg=#{@bg3},bg=#{@bg1}' 

# ---- Miscellaneous ----
# clock
set-window-option -gF clock-mode-colour '#{@blue}'

# bell
set-window-option -g window-status-bell-style fg='#{@bg0}',bg='#{@statusline3}'

# ---- Statusbar format ----
set-option -g status-justify left
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@bg0},bg=#{@orange},nobold] #S '

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#{prefix_highlight}#[fg=#{@grey1},bg=default] %a %d %b #[fg=#{@grey1},bg=#{@bg_dim},nobold] %H:%M '

set -g window-status-separator '#[fg=#{@grey0},bg=#{@bg1}]'
set -g window-status-format "#[fg=#{@grey0},bg=#{@bg_dim}] #I:#[fg=#{@grey0},bg=#{@bg_dim}]#W "
set -g window-status-current-format "#[fg=#{@orange},bg=#{@bg_dim}] #I:#[fg=#{@orange},bg=#{@bg_dim},nobold]#W "

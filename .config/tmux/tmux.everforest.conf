set -g @light_statusline2 '#708089'
set -g @light_statusline3 '#E66868'


# TMUX color assignments
set -g dark-theme-black '#{@bg_dim}'
set -g dark-theme-white '#{@fg}'
set -g dark-theme-light-grey '#{@grey1}'
set -g dark-theme-dark-grey '#{@bg3}'
set -g dark-theme-green '#{@green}'
set -g dark-theme-yellow '#{@orange}'
set -g dark-theme-blue '#{@blue}'
set -g dark-theme-red '#{@red}'
set -g dark-theme-cyan '#{@aqua}'
set -g dark-theme-magenta '#{@purple}'

set -g light-theme-black '#{@light_bg4}'
set -g light-theme-white '#{@light_bg_dim}'
set -g light-theme-light-grey '#{@light_grey1}'
set -g light-theme-dark-grey '#{@light_bg5}'
set -g light-theme-green '#{@light_green}'
set -g light-theme-yellow '#{@light_orange}'
set -g light-theme-blue '#{@light_blue}'
set -g light-theme-red '#{@light_red}'
set -g light-theme-cyan '#{@light_aqua}'
set -g light-theme-magenta '#{@light_purple}'


# ---- General ----
set -g mode-style fg=themeyellow,bg=themeblack # session switcher
set -g message-style fg=themered,bg=themeblack,fill=themeblack # message bar
set -g tree-mode-border-style fg=themeblue,bg=default # remove thick padding

# ---- Panes ----
set -g pane-border-style fg=themedarkgrey
set -g pane-active-border-style fg=themeblue

# ---- Statusbar format ----
set -g status-style fg=themelightgrey,bg=themeblack
setw -g window-status-current-style fg=themeyellow,bg=themeblack

set -g status-left '#[fg=themeblack,bg=themeyellow,nobold] #S '
set -g status-right '#{prefix_highlight} %a %d %b %H:%M '

set -g window-status-separator ''
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# ---- Plugins ----
set -g @prefix_highlight_fg themeblack
set -g @prefix_highlight_copy_mode_attr fg=themeblack,bg=themeyellow
